<script>
    async function atualizar() {
        const btn = document.querySelector('button');
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const link = document.getElementById('m3uLink').value.trim();
        const msg = document.getElementById('msg');
        
        // Efeito visual imediato para saber que o clique funcionou
        msg.style.color = "#ff4500";
        msg.innerText = "⏳ Iniciando...";
        btn.disabled = true; // Desativa o botão temporariamente
        btn.style.opacity = "0.5";

        if(!token || !link || !repo) { 
            msg.innerText = "⚠️ Preencha todos os campos!";
            resetBtn(btn);
            return; 
        }

        try {
            // 1. Buscar o SHA do arquivo (necessário para atualizar)
            const urlMetadata = `https://api.github.com/repos/${repo}/contents/lista.txt`;
            const res = await fetch(urlMetadata, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (!res.ok) {
                throw new Error("Repositório ou Token inválidos (Arquivo lista.txt existe?)");
            }

            const data = await res.json();
            
            // 2. Codificar o link para Base64 (Método seguro para navegadores novos)
            const b64Content = btoa(unescape(encodeURIComponent(link)));

            // 3. Enviar para o GitHub
            const update = await fetch(urlMetadata, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ 
                    message: "Update via Painel", 
                    content: b64Content, 
                    sha: data.sha 
                })
            });

            if (update.ok) {
                msg.style.color = "#00ff00";
                msg.innerText = "✅ Sincronizado com Sucesso!";
            } else {
                const erroServidor = await update.json();
                msg.innerText = "❌ Erro GitHub: " + erroServidor.message;
            }

        } catch (e) { 
            msg.innerText = "❌ Falha: " + e.message;
            console.error(e);
        } finally {
            resetBtn(btn);
        }
    }

    function resetBtn(btn) {
        btn.disabled = false;
        btn.style.opacity = "1";
    }
</script>
