<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel VidYou - Emissor</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
        .painel { width: 90%; max-width: 400px; background: #1a1a1a; padding: 30px; border-radius: 10px; border: 2px solid #ff4500; box-shadow: 0 0 20px rgba(255, 69, 0, 0.2); }
        h1 { color: #ff4500; text-align: center; font-size: 1.5rem; margin-bottom: 25px; text-transform: uppercase; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #ff4500; color: #fff; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 15px; background: #ff4500; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #e63e00; }
        #msg { text-align: center; margin-top: 20px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
<div class="painel">
    <h1>EMISSOR VIDYOU</h1>
    <label>SEU NOVO TOKEN (ghp_...)</label>
    <input type="password" id="ghToken" placeholder="Cole o token aqui na hora de usar">
    <label>REPOSITÓRIO</label>
    <input type="text" id="ghRepo" value="Roneiltonsouza/vidyouiptvpro" readonly style="opacity: 0.6;">
    <label>LINK DA LISTA M3U</label>
    <textarea id="m3uLink" rows="3">https://raw.githubusercontent.com/Roneiltonsouza/lista-canais/refs/heads/main/lista_atualizada%20(3).m3u</textarea>
    <button id="btn" onclick="atualizar()">ATUALIZAR LISTA</button>
    <div id="msg"></div>
</div>
<script>
    async function atualizar() {
        const btn = document.getElementById('btn');
        const msg = document.getElementById('msg');
        const token = document.getElementById('ghToken').value.trim();
        const repo = "Roneiltonsouza/vidyouiptvpro";
        const link = document.getElementById('m3uLink').value.trim();
        if(!token) { msg.innerText = "⚠️ Cole seu Token!"; return; }
        msg.style.color = "#ff4500"; msg.innerText = "⏳ Sincronizando..."; btn.disabled = true;
        try {
            const url = `https://api.github.com/repos/${repo}/contents/lista.txt`;
            const headers = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };
            const res = await fetch(url, { headers });
            const data = await res.json();
            const update = await fetch(url, {
                method: 'PUT', headers,
                body: JSON.stringify({ message: "Update", content: btoa(unescape(encodeURIComponent(link))), sha: data.sha })
            });
            if (update.ok) { msg.style.color = "#00ff00"; msg.innerText = "✅ Sincronizado com Sucesso!"; }
            else { msg.innerText = "❌ Token inválido ou sem permissão."; }
        } catch (e) { msg.innerText = "❌ Erro de conexão."; }
        finally { btn.disabled = false; }
    }
</script>
</body>
</html>
